name: Customer
label: Customer
label_plural: Customers
table: customers
soft_delete: true
audit: true
description: Guest record. Optionally link a Person; keep name, email, and phone for walk-ins.
fields:
  - name: person_id
    type: relation
    nullable: true
    label: Person
    relation:
      target_entity: Person
      kind: many_to_one
    ui:
      section: Identity
      help: Optional. Link a Person for a known individual. Walk-ins leave this empty and use name, email, and phone on this Customer.
      list: true
  - name: party_type
    type: enum
    nullable: true
    label: Party type
    enum_values: [Person, Organization]
    ui:
      section: Identity
  - name: organization_id
    type: relation
    nullable: true
    label: Organization
    relation:
      target_entity: Organization
      kind: many_to_one
    ui:
      section: Identity
      list: true
  - name: name
    type: string
    required: true
    searchable: true
    validation:
      max_length: 200
    ui:
      section: Contact
  - name: email
    type: string
    required: true
    unique: true
    searchable: true
    validation:
      email: true
    ui:
      section: Contact
  - name: phone
    type: string
    nullable: true
    ui:
      section: Contact
