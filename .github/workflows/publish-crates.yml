name: Publish crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (do not publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set."
            exit 1
          fi
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          crates=(
            qefro-core
            qefro-search
            qefro-permissions
            qefro-workflow
            qefro-events
            qefro-tenant
            qefro-auth
            qefro-agent
            qefro-db
            qefro-api
            qefro-restaurant
            qefro-crm
            qefro-cli
          )
          for crate in "${crates[@]}"; do
            echo "::group::publish $crate"
            if cargo publish -p "$crate" --allow-dirty $DRY; then
              echo "published $crate"
            else
              echo "publish $crate failed (may already exist)"
              exit 1
            fi
            echo "::endgroup::"
            if [ -z "$DRY" ]; then
              # crates.io: 5 new crates burst, then 1 every 10 minutes
              sleep 610
            fi
          done
