[package]
name = "qefro-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for Qefro Framework"
readme = "README.md"
homepage.workspace = true
keywords = ["qefro", "cli", "framework", "postgres"]
categories = ["command-line-utilities", "web-programming"]
default-run = "qefro"

[[bin]]
name = "qefro"
path = "src/main.rs"
doc = false

[dependencies]
qefro-core.workspace = true
qefro-api.workspace = true
qefro-db.workspace = true
qefro-permissions.workspace = true
qefro-workflow.workspace = true
qefro-search.workspace = true
qefro-restaurant.workspace = true
qefro-crm.workspace = true
qefro-tenant.workspace = true
uuid.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Used when this crate is the package root (`cargo install qefro-cli` from crates.io).
# Workspace builds ignore member profiles; the same settings live in the root Cargo.toml.
[profile.release]
strip = "none"

[profile.release.package.sqlx-macros]
strip = "none"
